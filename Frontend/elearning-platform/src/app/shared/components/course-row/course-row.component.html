<section class="mb-10" *ngIf="!compact || loading || courses.length > 0">
  <h2 *ngIf="title && !compact" class="text-2xl font-bold text-gray-900 mb-1">{{ title }}</h2>
  <p *ngIf="subtitle && !compact" class="text-gray-600 mb-4">{{ subtitle }}</p>

  <div *ngIf="loading" class="flex gap-4 overflow-hidden">
    <div *ngFor="let _ of [1,2,3,4,5]" class="w-72 shrink-0 animate-pulse">
      <div class="aspect-video bg-gray-200 rounded-md mb-2"></div>
      <div class="h-4 bg-gray-200 rounded w-3/4 mb-2"></div>
      <div class="h-3 bg-gray-200 rounded w-1/2"></div>
    </div>
  </div>

  <div *ngIf="!loading && courses.length === 0 && !compact" class="text-gray-500 text-sm py-4">
    No courses to show.
  </div>

  <div *ngIf="!loading && courses.length > 0"
       class="flex gap-4 overflow-x-auto pb-3 -mx-4 px-4 snap-x snap-mandatory">
    <app-course-card *ngFor="let course of courses; trackBy: trackId"
                     [course]="course"
                     [redirectGuestToAuth]="redirectGuestToAuth"
                     class="snap-start"></app-course-card>
  </div>
</section>
