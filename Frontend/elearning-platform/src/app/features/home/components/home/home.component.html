<div class="min-h-screen bg-white">
  <main class="max-w-7xl mx-auto px-4 py-8">
    <section class="flex items-center gap-4 mb-10" *ngIf="user">
      <div class="w-16 h-16 rounded-full bg-gray-900 text-white flex items-center justify-center text-xl font-bold">
        {{ initials }}
      </div>
      <div>
        <h1 class="text-2xl font-bold text-gray-900">Welcome back, {{ firstName }}</h1>
        <a routerLink="/profile" class="text-sm text-indigo-700 underline">
          Add occupation and interests
        </a>
      </div>
    </section>

    <h2 *ngIf="user" class="text-3xl font-bold text-gray-900 mb-6">What to learn next</h2>

    <app-course-row
      [title]="user ? 'Recommended for you' : undefined"
      [courses]="recommended"
      [loading]="loadingRecommended"
      [compact]="!user"
      [redirectGuestToAuth]="!user">
    </app-course-row>

    <app-course-row
      title="Most popular"
      subtitle="Most enrolled courses on the platform"
      [courses]="popular"
      [loading]="loadingPopular"
      [compact]="!user">
    </app-course-row>

    <app-course-row
      title="Top rated"
      subtitle="Highest-rated by learners"
      [courses]="topRated"
      [loading]="loadingTopRated"
      [compact]="!user">
    </app-course-row>
  </main>
</div>
