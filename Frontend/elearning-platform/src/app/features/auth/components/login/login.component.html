<div class="min-h-screen bg-gradient-to-br from-indigo-600 to-purple-700 flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-lg shadow-xl p-8">
    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-900 mb-2">Welcome Back</h1>
      <p class="text-gray-600">Sign in to continue learning</p>
    </div>

    <!-- Error Alert -->
    <div *ngIf="error" class="mb-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded">
      {{ error }}
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <!-- Email -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
        <input
          type="email"
          formControlName="email"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition"
          placeholder="you@example.com"
        />
        <span *ngIf="email?.invalid && email?.touched" class="text-red-500 text-sm">
          Please enter a valid email
        </span>
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <div class="relative">
          <input
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            class="w-full px-4 py-2 pr-10 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition"
            placeholder="••••••••"
          />
          <button
            type="button"
            (click)="togglePasswordVisibility()"
            class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-500 hover:text-gray-700"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            tabindex="-1"
          >
            <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12c1.292 4.338 5.31 7.5 10.066 7.5.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
          </button>
        </div>
        <span *ngIf="password?.invalid && password?.touched" class="text-red-500 text-sm">
          Password must be at least 6 characters
        </span>
      </div>

      <!-- Remember Me -->
      <div class="flex items-center">
        <input
          type="checkbox"
          id="remember"
          [(ngModel)]="rememberMe"
          [ngModelOptions]="{standalone: true}"
          class="w-4 h-4 text-indigo-600 border-gray-300 rounded focus:ring-2 focus:ring-indigo-500"
        />
        <label for="remember" class="ml-2 text-sm text-gray-600 cursor-pointer">
          Remember me
        </label>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        [disabled]="loginForm.invalid || loading"
        class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-400 text-white font-medium py-2 px-4 rounded-lg transition duration-200"
      >
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <!-- Google Sign-In -->
    <div class="flex items-center my-6">
      <div class="flex-1 border-t border-gray-200"></div>
      <span class="px-3 text-sm text-gray-400">or</span>
      <div class="flex-1 border-t border-gray-200"></div>
    </div>
    <div class="flex justify-center">
      <div id="g_id_signin"></div>
    </div>

    <!-- Forgot Password Link -->
    <div class="text-center mt-4">
      <a routerLink="/auth/forgot-password" class="text-indigo-600 hover:text-indigo-700 text-sm font-medium">
        Forgot password?
      </a>
    </div>

    <!-- Register Link -->
    <div class="border-t border-gray-200 mt-6 pt-6">
      <p class="text-center text-gray-600">
        Don't have an account?
        <a routerLink="/auth/register" class="text-indigo-600 hover:text-indigo-700 font-medium">
          Register here
        </a>
      </p>
    </div>

    <!-- <div class="mt-6 p-4 bg-blue-50 border border-blue-200 rounded-lg">
      <p class="text-sm font-medium text-blue-900 mb-2">Demo Credentials:</p>
      <p class="text-xs text-blue-800">Email: student&#64;elearning.com</p>
      <p class="text-xs text-blue-800">Password: Student&#64;123</p>
    </div> -->
  </div>
</div>
