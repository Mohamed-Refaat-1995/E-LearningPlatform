<div class="min-h-screen bg-gradient-to-br from-indigo-50 to-purple-50 flex items-center justify-center px-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">

    <!-- Icon -->
    <div class="flex justify-center mb-6">
      <div class="w-16 h-16 bg-indigo-100 rounded-full flex items-center justify-center">
        <svg class="w-8 h-8 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
        </svg>
      </div>
    </div>

    <h1 class="text-2xl font-bold text-gray-900 text-center mb-1">Verify your email</h1>
    <p class="text-sm text-gray-500 text-center mb-6">
      We sent a 6-digit code to <strong class="text-gray-700">{{ email }}</strong>
    </p>

    <!-- Success -->
    <div *ngIf="success" class="mb-4 p-3 bg-green-50 border border-green-200 text-green-700 rounded-lg text-sm text-center">
      {{ success }}
    </div>

    <!-- Error -->
    <div *ngIf="error" class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm text-center">
      {{ error }}
    </div>

    <!-- OTP inputs -->
    <div class="flex justify-center gap-3 mb-6" (paste)="onPaste($event)">
      <input
        *ngFor="let digit of otp; let i = index"
        [id]="'otp-' + i"
        type="text"
        inputmode="numeric"
        maxlength="1"
        [value]="otp[i]"
        (input)="onInput($event, i)"
        (keydown)="onKeydown($event, i)"
        class="w-12 h-14 text-center text-2xl font-bold border-2 rounded-xl focus:outline-none focus:border-indigo-500 transition"
        [class.border-red-400]="error"
        [class.border-gray-200]="!error"
      />
    </div>

    <!-- Verify button -->
    <button
      (click)="verify()"
      [disabled]="loading || otpValue.length !== 6"
      class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white font-semibold rounded-xl transition"
    >
      <span *ngIf="!loading">Verify Email</span>
      <span *ngIf="loading" class="flex items-center justify-center gap-2">
        <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
        </svg>
        Verifying...
      </span>
    </button>

    <!-- Resend -->
    <div class="mt-6 text-center text-sm text-gray-500">
      Didn't receive the code?
      <button
        (click)="resendOtp()"
        [disabled]="countdown > 0 || resendLoading"
        class="ml-1 font-semibold text-indigo-600 hover:underline disabled:opacity-40 disabled:no-underline"
      >
        <span *ngIf="resendLoading">Sending...</span>
        <span *ngIf="!resendLoading && countdown === 0">Resend OTP</span>
        <span *ngIf="!resendLoading && countdown > 0">Resend in {{ countdown }}s</span>
      </button>
    </div>

    <div class="mt-4 text-center">
      <a routerLink="/auth/register" class="text-sm text-gray-400 hover:text-gray-600">Back to Register</a>
    </div>
  </div>
</div>
