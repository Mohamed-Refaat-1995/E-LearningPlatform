<div class="min-h-screen bg-gradient-to-br from-indigo-50 to-purple-50 flex items-center justify-center px-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">

    <h1 class="text-2xl font-bold text-gray-900 text-center mb-1">Set a new password</h1>
    <p class="text-sm text-gray-500 text-center mb-6">Choose a strong password for your account.</p>

    <div *ngIf="success" class="mb-4 p-3 bg-green-50 border border-green-200 text-green-700 rounded-lg text-sm text-center">
      {{ success }}
    </div>
    <div *ngIf="error" class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm text-center">
      {{ error }}
    </div>

    <form *ngIf="!success" [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
        <div class="relative">
          <input [type]="showPassword ? 'text' : 'password'" formControlName="password"
            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm pr-10" />
          <button type="button" (click)="showPassword = !showPassword" class="absolute right-3 top-2.5 text-gray-400 text-xs">
            {{ showPassword ? 'Hide' : 'Show' }}
          </button>
        </div>
        <p *ngIf="password?.invalid && password?.touched" class="text-xs text-red-600 mt-1">
          Min 6 chars, with uppercase, lowercase, digit and special character.
        </p>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
        <div class="relative">
          <input [type]="showConfirm ? 'text' : 'password'" formControlName="confirmPassword"
            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm pr-10" />
          <button type="button" (click)="showConfirm = !showConfirm" class="absolute right-3 top-2.5 text-gray-400 text-xs">
            {{ showConfirm ? 'Hide' : 'Show' }}
          </button>
        </div>
        <p *ngIf="form.errors?.['mismatch'] && confirmPassword?.touched" class="text-xs text-red-600 mt-1">
          Passwords do not match.
        </p>
      </div>

      <button type="submit" [disabled]="loading || form.invalid"
        class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white font-semibold rounded-xl transition">
        {{ loading ? 'Resetting...' : 'Reset Password' }}
      </button>
    </form>

    <div class="mt-4 text-center">
      <a routerLink="/auth/login" class="text-sm text-gray-400 hover:text-gray-600">Back to Login</a>
    </div>
  </div>
</div>
