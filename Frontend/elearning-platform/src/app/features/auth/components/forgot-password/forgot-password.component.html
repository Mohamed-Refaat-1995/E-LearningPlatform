<div class="min-h-screen bg-gradient-to-br from-indigo-600 to-purple-700 flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-lg shadow-xl p-8">
    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-900 mb-2">Forgot Password</h1>
      <p class="text-gray-600">
        Enter your email and we'll send you a link to reset your password
      </p>
    </div>

    <!-- Error Alert -->
    <div *ngIf="error" class="mb-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded">
      {{ error }}
    </div>

    <!-- Confirmation state -->
    <div *ngIf="submitted" class="text-center">
      <div class="mb-4 p-4 bg-green-100 border border-green-400 text-green-700 rounded">
        Check your inbox — we've sent a password reset link to <strong>{{ email?.value }}</strong>.
      </div>
      <a routerLink="/auth/login" class="text-indigo-600 hover:text-indigo-700 font-medium">
        Back to Sign in
      </a>
    </div>

    <!-- Email form -->
    <form *ngIf="!submitted" [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmitEmail()" class="space-y-4">
      <!-- Email -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
        <input
          type="email"
          formControlName="email"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition"
          placeholder="you@example.com"
        />
        <span *ngIf="email?.invalid && email?.touched" class="text-red-500 text-sm">
          Please enter a valid email
        </span>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        [disabled]="forgotPasswordForm.invalid || loading"
        class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-400 text-white font-medium py-2 px-4 rounded-lg transition duration-200"
      >
        {{ loading ? 'Sending...' : 'Send Reset Link' }}
      </button>
    </form>

    <!-- Login Link -->
    <div *ngIf="!submitted" class="border-t border-gray-200 mt-6 pt-6">
      <p class="text-center text-gray-600">
        Remember your password?
        <a routerLink="/auth/login" class="text-indigo-600 hover:text-indigo-700 font-medium">
          Sign in
        </a>
      </p>
    </div>
  </div>
</div>
