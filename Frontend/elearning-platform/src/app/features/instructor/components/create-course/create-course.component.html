<div class="min-h-screen bg-gray-50">
  <div class="max-w-4xl mx-auto py-8 px-4">
    <a routerLink="/instructor" class="text-indigo-600 hover:text-indigo-700 font-medium mb-4 inline-block">← Back</a>
    <h1 class="text-3xl font-bold text-gray-900 mt-4">Create New Course</h1>
    <p class="text-gray-600 mt-2">Fill in the details below to create your course</p>

    <div class="bg-white rounded-lg shadow p-8 mt-8">
      <div *ngIf="error" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded mb-4">{{ error }}</div>
      <div *ngIf="success" class="bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded mb-4">{{ success }}</div>

      <form [formGroup]="courseForm" (ngSubmit)="onSubmit()" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Title</label>
          <input type="text" formControlName="title"
            class="w-full border border-gray-300 rounded px-3 py-2"
            placeholder="Course title (min 5 chars)" />
          <p *ngIf="title?.touched && title?.invalid" class="text-red-600 text-sm mt-1">Title must be at least 5 characters.</p>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
          <textarea formControlName="description" rows="4"
            class="w-full border border-gray-300 rounded px-3 py-2"
            placeholder="Describe what students will learn"></textarea>
          <p *ngIf="description?.touched && description?.invalid" class="text-red-600 text-sm mt-1">Description must be at least 20 characters.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
            <select formControlName="category" class="w-full border border-gray-300 rounded px-3 py-2">
              <option value="">Select category</option>
              <option *ngFor="let c of categories" [value]="c">{{ c }}</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Level</label>
            <select formControlName="level" class="w-full border border-gray-300 rounded px-3 py-2">
              <option *ngFor="let l of levels" [value]="l">{{ l }}</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Price (USD)</label>
            <input type="number" formControlName="price" min="0" step="0.01"
              class="w-full border border-gray-300 rounded px-3 py-2" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Thumbnail URL (optional)</label>
            <input type="url" formControlName="thumbnailUrl"
              class="w-full border border-gray-300 rounded px-3 py-2"
              placeholder="https://..." />
          </div>
        </div>

        <button type="submit" [disabled]="courseForm.invalid || submitting"
          class="bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-400 text-white px-6 py-2 rounded-lg font-medium transition">
          {{ submitting ? 'Creating...' : 'Create Course' }}
        </button>
      </form>
    </div>
  </div>
</div>
