<div class="min-h-screen bg-gray-50 py-10 px-4">
  <div class="max-w-lg mx-auto">
    <div class="mb-8">
      <h1 class="text-2xl font-bold text-gray-900">Study Timer</h1>
      <p class="text-gray-500 mt-1">Stay focused and track your study sessions</p>
    </div>

    <!-- Mode tabs -->
    <div class="flex gap-2 mb-6 bg-white rounded-xl p-1 shadow-sm border border-gray-200">
      <button *ngFor="let m of ['focus','short','long','custom']"
        (click)="setMode(m)"
        [class.bg-indigo-600]="mode === m && m === 'focus'"
        [class.text-white]="mode === m"
        [class.bg-green-500]="mode === m && m === 'short'"
        [class.bg-blue-500]="mode === m && m === 'long'"
        [class.bg-purple-500]="mode === m && m === 'custom'"
        [class.text-gray-600]="mode !== m"
        class="flex-1 py-2 rounded-lg text-sm font-medium transition">
        {{ m === 'focus' ? 'Focus' : m === 'short' ? 'Short Break' : m === 'long' ? 'Long Break' : 'Custom' }}
      </button>
    </div>

    <!-- Custom duration input -->
    <div *ngIf="mode === 'custom'" class="mb-4 flex items-center gap-3">
      <label class="text-sm font-medium text-gray-700">Duration (minutes):</label>
      <input type="number" [(ngModel)]="customMinutes" (change)="resetTimer()" min="1" max="120"
        class="w-20 px-3 py-1 border border-gray-300 rounded-lg text-center text-sm focus:ring-2 focus:ring-purple-500 outline-none" />
    </div>

    <!-- Timer ring -->
    <div class="flex flex-col items-center mb-8">
      <div class="relative w-56 h-56">
        <svg class="w-full h-full -rotate-90" viewBox="0 0 200 200">
          <circle cx="100" cy="100" r="90" fill="none" stroke="#e5e7eb" stroke-width="10" />
          <circle cx="100" cy="100" r="90" fill="none" stroke-width="10"
            [attr.stroke]="mode === 'focus' ? '#6366f1' : mode === 'short' ? '#22c55e' : mode === 'long' ? '#3b82f6' : '#a855f7'"
            [attr.stroke-dasharray]="circumference"
            [attr.stroke-dashoffset]="dashOffset"
            stroke-linecap="round"
            class="transition-all duration-1000" />
        </svg>
        <div class="absolute inset-0 flex flex-col items-center justify-center">
          <span class="text-5xl font-mono font-bold text-gray-800">{{ minutes }}:{{ seconds }}</span>
          <span class="text-sm text-gray-400 mt-1">{{ modeConfig.label }}</span>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="flex gap-3 justify-center mb-8">
      <button (click)="resetTimer()"
        class="px-5 py-2.5 border border-gray-300 rounded-xl text-gray-700 hover:bg-gray-100 font-medium transition">
        Reset
      </button>
      <button (click)="toggleTimer()"
        class="px-8 py-2.5 rounded-xl text-white font-semibold text-lg transition"
        [class.bg-indigo-600]="mode === 'focus'"
        [class.hover:bg-indigo-700]="mode === 'focus'"
        [class.bg-green-500]="mode === 'short'"
        [class.hover:bg-green-600]="mode === 'short'"
        [class.bg-blue-500]="mode === 'long'"
        [class.hover:bg-blue-600]="mode === 'long'"
        [class.bg-purple-500]="mode === 'custom'"
        [class.hover:bg-purple-600]="mode === 'custom'">
        {{ running ? 'Pause' : (secondsLeft === totalSeconds ? 'Start' : 'Resume') }}
      </button>
    </div>

    <!-- Daily progress -->
    <div class="bg-white border border-gray-200 rounded-xl p-5 shadow-sm">
      <div class="flex items-center justify-between mb-2">
        <span class="text-sm font-medium text-gray-700">Today's progress</span>
        <span class="text-sm text-gray-500">{{ todaySessions }} / {{ dailyGoal }} sessions</span>
      </div>
      <div class="w-full bg-gray-100 rounded-full h-3 mb-4">
        <div class="h-3 bg-indigo-500 rounded-full transition-all duration-500"
          [style.width.%]="(todaySessions / dailyGoal) * 100 | number:'1.0-0'">
        </div>
      </div>
      <div class="flex items-center gap-3">
        <label class="text-xs text-gray-500">Daily goal:</label>
        <select class="text-xs border border-gray-300 rounded px-2 py-1" [ngModel]="dailyGoal" (ngModelChange)="setGoal($event)">
          <option [value]="2">2 sessions</option>
          <option [value]="4">4 sessions</option>
          <option [value]="6">6 sessions</option>
          <option [value]="8">8 sessions</option>
        </select>
      </div>
      <p *ngIf="todaySessions >= dailyGoal && dailyGoal > 0" class="mt-3 text-sm text-green-600 font-medium">
        Goal reached! Great work today.
      </p>
    </div>

    <div class="mt-6 text-center">
      <a routerLink="/dashboard" class="text-sm text-indigo-600 hover:underline">← Back to Dashboard</a>
    </div>
  </div>
</div>
