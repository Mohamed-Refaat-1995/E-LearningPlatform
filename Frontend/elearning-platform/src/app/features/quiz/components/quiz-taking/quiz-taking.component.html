<div class="min-h-screen bg-gray-50" *ngIf="!loading && quiz">
  <!-- Header -->
  <div class="bg-white shadow sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">{{ quiz.title }}</h1>
        <p class="text-sm text-gray-600">Question {{ currentQuestionIndex + 1 }} of {{ quiz.questions?.length || 0 }}</p>
      </div>
      <div class="text-right">
        <p class="text-sm text-gray-600">Time Remaining</p>
        <p class="text-3xl font-bold" [ngClass]="{'text-red-600': timeRemaining < 60, 'text-gray-900': timeRemaining >= 60}">
          {{ getTimeDisplay() }}
        </p>
      </div>
    </div>
  </div>

  <div class="max-w-6xl mx-auto py-8 px-4">
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
      <!-- Question Navigator -->
      <div class="lg:col-span-1">
        <div class="bg-white rounded-lg shadow p-4 sticky top-20">
          <h3 class="font-bold text-gray-900 mb-4">Questions</h3>
          <div class="grid grid-cols-4 lg:grid-cols-3 gap-2">
            <button
              *ngFor="let q of quiz.questions; let i = index"
              (click)="goToQuestion(i)"
              [class.bg-indigo-600]="currentQuestionIndex === i"
              [class.bg-blue-100]="currentQuestionIndex !== i && getAnswers().at(i)?.get('selectedAnswerId')?.value"
              [class.bg-gray-200]="currentQuestionIndex !== i && !getAnswers().at(i)?.get('selectedAnswerId')?.value"
              class="w-full py-2 rounded text-sm font-medium transition"
              [ngClass]="{
                'text-white': currentQuestionIndex === i,
                'text-gray-900': currentQuestionIndex !== i
              }"
            >
              {{ i + 1 }}
            </button>
          </div>
          <p class="text-xs text-gray-500 mt-4">
            <span class="inline-block w-3 h-3 bg-indigo-600 rounded mr-2"></span>Current
          </p>
          <p class="text-xs text-gray-500">
            <span class="inline-block w-3 h-3 bg-blue-100 rounded mr-2"></span>Answered
          </p>
        </div>
      </div>

      <!-- Question Content -->
      <div class="lg:col-span-3">
        <div class="bg-white rounded-lg shadow p-8">
          <form [formGroup]="quizForm">
            <div [formGroup]="getCurrentAnswerGroup()" class="mb-8">
              <!-- Question Text -->
              <h2 class="text-2xl font-bold text-gray-900 mb-6">
                {{ currentQuestion?.questionText }}
              </h2>

              <!-- Question Type: Multiple Choice -->
              <div *ngIf="currentQuestion?.questionType === 'MultipleChoice'" class="space-y-4">
                <div *ngFor="let answer of currentQuestion.answers" class="flex items-center">
                  <input
                    type="radio"
                    [id]="'answer-' + answer.id"
                    [value]="answer.id"
                    formControlName="selectedAnswerId"
                    class="w-4 h-4 text-indigo-600 focus:ring-2 focus:ring-indigo-500"
                  />
                  <label [for]="'answer-' + answer.id" class="ml-3 block text-lg text-gray-700 cursor-pointer">
                    {{ answer.answerText }}
                  </label>
                </div>
              </div>

              <!-- Question Type: True/False -->
              <div *ngIf="currentQuestion?.questionType === 'TrueFalse'" class="space-y-4">
                <div class="flex gap-4">
                  <label class="flex items-center cursor-pointer">
                    <input
                      type="radio"
                      value="true"
                      formControlName="selectedAnswerId"
                      class="w-4 h-4 text-indigo-600 focus:ring-2 focus:ring-indigo-500"
                    />
                    <span class="ml-3 text-lg text-gray-700">True</span>
                  </label>
                  <label class="flex items-center cursor-pointer">
                    <input
                      type="radio"
                      value="false"
                      formControlName="selectedAnswerId"
                      class="w-4 h-4 text-indigo-600 focus:ring-2 focus:ring-indigo-500"
                    />
                    <span class="ml-3 text-lg text-gray-700">False</span>
                  </label>
                </div>
              </div>

              <!-- Question Type: Short Answer -->
              <div *ngIf="currentQuestion?.questionType === 'ShortAnswer'">
                <textarea
                  formControlName="textAnswer"
                  rows="5"
                  placeholder="Type your answer here..."
                  class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
                ></textarea>
              </div>
            </div>

            <!-- Navigation Buttons -->
            <div class="flex items-center justify-between gap-4 pt-8 border-t">
              <button
                type="button"
                (click)="previousQuestion()"
                [disabled]="currentQuestionIndex === 0"
                class="px-6 py-2 border border-gray-300 rounded-lg disabled:opacity-50 disabled:cursor-not-allowed hover:bg-gray-50 font-medium transition"
              >
                ← Previous
              </button>

              <div class="flex-1"></div>

              <button
                type="button"
                (click)="nextQuestion()"
                [disabled]="currentQuestionIndex === quiz.questions.length - 1"
                class="px-6 py-2 border border-gray-300 rounded-lg disabled:opacity-50 disabled:cursor-not-allowed hover:bg-gray-50 font-medium transition"
              >
                Next →
              </button>

              <button
                type="button"
                (click)="submitQuiz()"
                [disabled]="submitting"
                class="px-8 py-2 bg-green-600 hover:bg-green-700 disabled:bg-gray-400 text-white rounded-lg font-medium transition"
              >
                {{ submitting ? 'Submitting...' : 'Submit Quiz' }}
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Loading State -->
<div *ngIf="loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mx-auto mb-4"></div>
    <p class="text-gray-600">Loading quiz...</p>
  </div>
</div>
