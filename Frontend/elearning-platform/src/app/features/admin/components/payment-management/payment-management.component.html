<div class="min-h-screen bg-gray-50">
  <div class="max-w-7xl mx-auto py-8 px-4">
    <a routerLink="/admin" class="text-indigo-600 hover:text-indigo-700 font-medium mb-4 inline-block">← Back</a>
    <h1 class="text-3xl font-bold text-gray-900 mt-4">Payment Management</h1>
    <p class="text-gray-600 mt-2">View transactions and manage refunds</p>

    <div class="bg-white rounded-lg shadow p-6 mt-8">
      <p *ngIf="loading" class="text-gray-500">Loading orders...</p>
      <p *ngIf="error" class="text-red-600">{{ error }}</p>

      <div *ngIf="!loading && orders.length === 0" class="text-gray-500">No orders found.</div>

      <table *ngIf="!loading && orders.length > 0" class="w-full text-left">
        <thead>
          <tr class="border-b border-gray-200">
            <th class="py-2">Order #</th>
            <th class="py-2">User</th>
            <th class="py-2">Amount</th>
            <th class="py-2">Status</th>
            <th class="py-2">Date</th>
            <th class="py-2">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let order of orders" class="border-b border-gray-100">
            <td class="py-2">#{{ order.id }}</td>
            <td class="py-2">{{ order.userId }}</td>
            <td class="py-2">{{ order.totalAmount | currency }}</td>
            <td class="py-2">{{ order.status }}</td>
            <td class="py-2">{{ order.createdAt | date }}</td>
            <td class="py-2">
              <button *ngIf="order.payments?.[0] && order.status === 'Paid'"
                (click)="refund(order.payments[0].id)" class="text-red-600 hover:underline">Refund</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
